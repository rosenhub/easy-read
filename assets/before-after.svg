<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#010409"/>
  <text x="600" y="46" text-anchor="middle" font-size="28" font-weight="800" fill="#e6edf3">"My bank sent a letter. It says my account is overdrawn. Am I in trouble?"</text>
  <text x="600" y="76" text-anchor="middle" font-size="17" font-style="italic" fill="#c9d1d9">An adult with an intellectual disability, holding the letter. Scared they did something wrong.</text>
  <text x="600" y="99" text-anchor="middle" font-size="13" fill="#6e7681">Same model. Same question. The only difference is one skill file.</text>

  <rect x="40" y="118" width="545" height="460" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="64" y="148" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8b949e">BEFORE</text>
  <text x="560" y="148" text-anchor="end" font-size="13" fill="#f85149">66 words · longest sentence 24 words</text>
  <rect x="64" y="166" width="497" height="376" rx="10" fill="#161b22" stroke="#30363d"/>
  <g fill="#e6edf3">
    <text x="84" y="196" font-size="15">An overdraft occurs when a transaction exceeds the</text>
    <text x="84" y="218" font-size="15">available balance in your checking account, resulting in</text>
    <text x="84" y="240" font-size="15">a negative balance. Depending on your bank's policies</text>
    <text x="84" y="262" font-size="15">and whether you've opted into overdraft protection, you</text>
    <text x="84" y="284" font-size="15">may incur fees, typically ranging from $25 to $35 per</text>
    <text x="84" y="306" font-size="15">transaction. It's important to address this promptly by</text>
    <text x="84" y="328" font-size="15">depositing sufficient funds, as continued overdrafts</text>
    <text x="84" y="350" font-size="15">could potentially lead to account closure or reporting</text>
    <text x="84" y="372" font-size="15">to ChexSystems.</text>
  </g>
  <text x="84" y="524" font-size="12" fill="#f85149">✗ never says "no"  ✗ "incur", "ChexSystems"  ✗ no example  ✗ no steps</text>

  <rect x="615" y="118" width="545" height="460" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="639" y="148" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8b949e">AFTER · easy-read</text>
  <text x="1135" y="148" text-anchor="end" font-size="13" fill="#3fb950">65 words · longest sentence 11 words</text>
  <rect x="639" y="166" width="497" height="376" rx="10" fill="#161b22" stroke="#30363d"/>
  <g fill="#e6edf3">
    <text x="659" y="202" font-size="22" font-weight="700">No. You are not in trouble.</text>
    <text x="659" y="244" font-size="15"><tspan font-weight="700">Overdrawn</tspan> means you spent more money</text>
    <text x="659" y="266" font-size="15">than was in your account.</text>
    <text x="659" y="288" font-size="15">Example: you had $20. You spent $30.</text>
    <text x="659" y="310" font-size="15">Now your account is at -$10.</text>
    <text x="659" y="344" font-size="15">What to do:</text>
    <text x="659" y="366" font-size="15">1. Put money into the account.</text>
    <text x="659" y="388" font-size="15">2. Call the phone number on the letter.</text>
    <text x="659" y="410" font-size="15">3. Ask: "Can you take away the fee?"</text>
    <text x="659" y="444" font-size="15" fill="#8b949e">Do you want me to say that a different way?</text>
    
  </g>
  <text x="659" y="524" font-size="12" fill="#3fb950">✓ answer first  ✓ word defined  ✓ example  ✓ 3 steps  ✓ check</text>
</svg>
